/* Prime cut: one shared shell, compact handset on small viewports, MeatOS on large displays. */

.mapLegend{text-align:center;font-size:10px;color:var(--muted)}

.inputSlide{flex:0 0 100%;width:100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;gap:6px;padding:2px;min-height:0}

 if(pane===6){const saved=JSON.parse(baseline),active=saved.profiles.find(x=>x.id===saved.active);return '<div class="heading monitorHeading"><h2>Saved profile</h2><small>'+esc(active.name)+'</small></div>'+renderInputMonitor(active,true,false);}
 return layerDeck(p,true);
}
function updateSaveBar(){
 const primary=$('primary'),pending=dirty()||conflict;
 primary.hidden=!pending&&!busy;
 primary.textContent=busy?'Busy':conflict?'Resolve':'Save';
 primary.title=conflict?'Resolve profile conflict':'Save changes';
 primary.setAttribute('aria-label',primary.title);
 primary.disabled=locked()||!pending||deviceMode&&!!deviceError&&!conflict;
 $('saveState').textContent=busy?'Operation in progress':conflict?'Device profile changed; draft retained':dirty()?'Unsaved changes':loadError?'Storage unavailable':'Settings saved';
 primary.onclick=()=>conflict?resolveConflict():save();
}
let canvasObserver;
function fitController(){
 canvasObserver?.disconnect();
 const canvas=$('canvas'),stage=canvas?.querySelector('.controllerStage');
 if(!stage)return;
 const resize=()=>{const w=Math.min(canvas.clientWidth,canvas.clientHeight*500/366);if(w>0){stage.style.width=w+'px';stage.style.height=(w*366/500)+'px';}};
 resize();
 if(typeof ResizeObserver!=='undefined'){canvasObserver=new ResizeObserver(resize);canvasObserver.observe(canvas);}
}
window.addEventListener('resize',fitController);

function render(){
 const focused=document.activeElement?.dataset?.key;
 document.querySelector('.window').classList.toggle('homeScreen',deck==='home');
 document.querySelector('.pager').hidden=deck==='home'||deck==='controller'||deck==='tuning';
 const p=profile();
 content.innerHTML=deviceMode&&!ready?'<div class="card"><h2>Connect to dongle</h2><p>'+esc(loadError||'Loading saved profile library…')+'</p><button id="retryDevice">Retry</button></div>':deviceMode&&departed?'<div class="card"><h2>Reconnect required</h2><p>'+esc(operationStatus)+'</p><p>Re-enter configuration mode if necessary and reload this page.</p></div>':deck==='network'?networkView():deck==='firmware'?firmwareView():deck==='diagnostics'?diagView():deck==='home'?renderHome():deck==='controller'?mapper():deck==='profiles'?renderProfiles():deck==='tuning'?tuningEditor():'<div class="placeholder">'+icon('about')+'<h2>'+esc(panes[deck][pane])+'</h2><p>Hambone Industries<br><small>A Meat Inc. subsidiary</small></p><p class="muted">'+(pane===2?'S.H.R.E.K. — Synthetic Hierarchical Response Enablement Kernel. Controllers have layers.':pane===1?'Select Controller to try the three Hambone-style vector skins. Confirm changes in the popup, then save or export the draft.':'The competition is running stock firmware. Adorable.<br><small>The Hambone name and logo are trademarks of Hambone Industries, a subsidiary of Meat Inc. (fictional branding).</small>')+'</p><small>Local design preview · based on upstream OGX.</small></div>';
 if(deviceMode&&operationStatus&&!departed&&deck!=='home'&&!(deck==='firmware'&&pane===3)){const note=document.createElement('small');note.className='deviceNote';note.textContent=operationStatus;content.append(note);}
 if(deck==='controller'&&pane!==0){const back=document.createElement('button');back.className='controllerBack';back.textContent='‹ Controller';back.onclick=()=>go('controller',0);content.prepend(back);}
 content.scrollTop=0;
 const monitor=content.querySelector('.widgetDeck');if(monitor){monitor.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&!e.ctrlKey){e.preventDefault();monitor.scrollLeft+=e.deltaY;}},{passive:false});monitor.addEventListener('keydown',e=>{if(e.target===monitor&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();monitor.scrollBy({left:(e.key==='ArrowRight'?1:-1)*monitor.clientWidth,behavior:'smooth'});}});}
 $('pick').textContent=(deck==='home'?'Home':panes[deck][pane])+' · '+(pane+1)+' / '+panes[deck].length;$('prev').disabled=pane===0;$('next').disabled=pane===panes[deck].length-1;
 updateSaveBar();fitController();bindTuning();
 content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{group=0;go(b.dataset.go,['controller','tuning'].includes(b.dataset.go)?0:undefined);});
 content.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{skin=b.dataset.skin;source=null;render();});

 content.querySelectorAll('[data-key]').forEach(b=>{b.onclick=()=>tap(+b.dataset.key);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(+b.dataset.key);}};});
 content.querySelectorAll('[data-advanced]').forEach(b=>b.onclick=()=>showTargetPicker(+b.dataset.advanced));
 content.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{editing=+b.dataset.profile;go('profiles',0);});
 const bind=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};
 bind('toggleMap',()=>{if(editable()){p.custom=!p.custom;source=null;render();}});
 bind('toggleIgr',()=>{if(editable()){p.igr=!p.igr;render();}});bind('library',()=>{group=0;go('profiles',1);});bind('activeMonitor',()=>go('profiles',6));
 bind('useProfile',()=>{library.active=editing;render();});bind('export',exportProfile);
 bind('groupPrev',()=>{group=pane===2&&deck==='controller'?(group+4)%5:Math.max(0,group-1);render();});bind('groupNext',()=>{group=pane===2&&deck==='controller'?(group+1)%5:group+1;render();});
 bindProfiles();bindDevice();syncDeviceChrome();
 if(deviceMode){if(locked()){for(const b of document.querySelectorAll('.window button,.window input,.window select'))b.disabled=true;}else{$('home').disabled=$('menu').disabled=$('pick').disabled=false;}
 const retry=$('retryDevice');if(retry){retry.disabled=false;retry.onclick=()=>refreshDevice({initial:true});}
 }
 if(focused)content.querySelector('[data-key="'+focused+'"]')?.focus({preventScroll:true});
 bind('other',()=>{if(source!==null){showTargetPicker(source);}else{modal('Select physical input','<div class="list">'+identityMap().filter(i=>!isReserved(i,p.igr)).map(i=>'<button data-extra="'+i+'">'+esc(physicalName(skin,i))+'</button>').join('')+'</div>',[{label:'Cancel'}]);dialog.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{closeModal();tap(+b.dataset.extra);});}});

}
$('home').onclick=()=>{group=0;go('home',0);};$('prev').onclick=()=>{group=0;step(-1);};$('next').onclick=()=>{group=0;step(1);};
function picker(workspaces){
 if(locked())return;
 const values=workspaces?Object.keys(panes):panes[deck];
 const local=workspaces&&(deck==='controller'||deck==='tuning')?'<div class="list contextual"><small>'+ (deck==='controller'?'Controller tools':'Tuning')+'</small>'+(deck==='controller'?panes.controller.map((v,i)=>'<button data-local-pane="'+i+'">'+v+'</button>').join(''):'<button data-local-pane="0">All inputs</button><button data-local-pane="15">Game vibration</button>')+'</div><hr>':'';
 const extras=workspaces?'<hr><p class="menuProfile"><small>Active profile</small><strong>'+esc(JSON.parse(baseline).profiles.find(p=>p.id===JSON.parse(baseline).active)?.name||'Unavailable')+'</strong></p><button id="menuExport">Export '+(dirty()?'draft':'profile')+'</button>'+(deviceMode?'<button id="menuStatus">Connection details</button><button id="menuGaming">Return to gaming</button>':''):'';
 modal(workspaces?'Workspaces':'Select pane',local+'<div class="list">'+values.map((v,i)=>'<button data-pick="'+i+'">'+esc(v[0].toUpperCase()+v.slice(1))+'</button>').join('')+extras+'</div>',[{label:'Cancel'}]);
 dialog.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{closeModal();group=0;if(workspaces)go(values[+b.dataset.pick]);else go(deck,+b.dataset.pick);});
 dialog.querySelectorAll('[data-local-pane]').forEach(b=>b.onclick=()=>{closeModal();go(deck,+b.dataset.localPane);});
 if($('menuExport'))$('menuExport').onclick=()=>{closeModal();exportProfile();};
 if($('menuStatus'))$('menuStatus').onclick=()=>{closeModal();connectionDetails();};
 if($('menuGaming'))$('menuGaming').onclick=()=>{closeModal();leaveGaming();};
}
$('menu').onclick=()=>picker(true);$('pick').onclick=()=>picker(false);
let gesture=null;
content.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.target.closest('button,input,select,textarea,svg,[data-key]')||dialog.open)return;gesture={x:e.clientX,y:e.clientY,id:e.pointerId};});
content.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){group=0;step(dx<0?1:-1);}});
content.addEventListener('pointercancel',()=>gesture=null);
let touchOrigin=null;
content.addEventListener('touchstart',e=>{touchOrigin=null;if(e.touches.length!==1||e.target.closest('button,input,select,textarea,svg,[data-key]')||dialog.open)return;const t=e.touches[0];touchOrigin={x:t.clientX,y:t.clientY,id:t.identifier};},{passive:true});
content.addEventListener('touchend',e=>{const start=touchOrigin;touchOrigin=null;if(!start||dialog.open)return;const t=Array.from(e.changedTouches).find(t=>t.identifier===start.id);if(!t)return;const dx=t.clientX-start.x,dy=t.clientY-start.y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){group=0;step(dx<0?1:-1);}},{passive:true});
content.addEventListener('touchcancel',()=>touchOrigin=null,{passive:true});
setupImport();initDevice();
window.addEventListener('beforeunload',e=>{if(dirty()||busy){e.preventDefault();e.returnValue='';}});
render();
</script></body></html>
