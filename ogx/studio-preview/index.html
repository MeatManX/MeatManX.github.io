 content.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>slotDialog(+b.dataset.slot));
 bind('resetMap',()=>{if(editable())modal('Restore button mapping?','<p>Only the stored button map is reset. Other tuning layers are unchanged.</p>',[{label:'Cancel'},{label:'Restore',primary:true,run:()=>{profile().map=identityMap();render();}}]);});
}
function setupImport(){
 $('importFile').onchange=async()=>{const f=$('importFile').files[0];if(!f)return;try{if(f.size>8192)throw Error('Profile file exceeds 8 KiB.');const p=StudioCodec.fromFile(JSON.parse(await f.text()));importProfile(p);}catch(e){modal('Import failed','<p class="error">'+esc(e.message)+'</p>',[{label:'Close'}]);}};
}

'use strict';
const $=id=>document.getElementById(id),content=$('content'),dialog=$('modal');
const key='ogx-studio-next-review-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy=o=>JSON.parse(JSON.stringify(o));
const base=(id,name,custom,map)=>({id,name,custom,left:100,right:100,igr:true,map,layers:StudioCodec.encode(StudioCodec.defaults())});
const initial=()=>({schema:2,revision:1,active:2,slots:[0,1,2,255],profiles:[base(0,'Default Xbox',false,identityMap()),base(1,'Rainbow Six 3',true,identityMap().map(i=>({3:9,9:3,4:10,10:4})[i]||i)),base(2,'My profile',false,identityMap())]});
let library=initial(),loadError='';
try{const raw=localStorage.getItem(key);if(raw){const d=JSON.parse(raw);if(d.schema!==2||!Array.isArray(d.profiles)||!d.profiles.every(StudioCodec.validProfile)||!d.profiles.some(p=>p.id===d.active))throw Error('Invalid preview library');library=d;}}catch(e){loadError=e.message;}
let baseline=JSON.stringify(library),editing=library.active,deck='home',pane=0,skin='modern',operation='remap',source=null,group=0,restoreFocus=null;
const last={};
const profile=()=>library.profiles.find(p=>p.id===editing),editable=()=>editing>=2,dirty=()=>JSON.stringify(library)!==baseline;
const panes={home:['Dashboard'],controller:['Overview','Visual remapper','Assignment summary','Advanced mapping','Transfer'],tuning:tuningPanes,profiles:['Active profile','Library','Quick slots','Manage profiles','Profile layers','Import review'],about:['About','Help','Desktop files']};
const icons={controller:'<path d="M7 7h10q3 0 4 4l1 5q0 4-3 3l-4-4H9l-4 4q-3 1-3-3l1-5q1-4 4-4Z"/><path d="M7 10v5m-2.5-2.5h5m6-1h.1m3 2h.1"/>',tuning:'<path d="M3 5h18M3 12h18M3 19h18M8 2v6m8 1v6m-5 1v6"/>',profiles:'<rect x="5" y="3" width="16" height="14" rx="2"/><path d="M3 7v12q0 2 2 2h12M9 8h8m-8 4h5"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.1"/>'};
const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[k]+'</svg>';
function go(d,i){if(dialog.open)return;source=null;group=0;deck=d;pane=i===undefined?(last[d]||0):i;last[d]=pane;render();}
function step(n){if(pane+n>=0&&pane+n<panes[deck].length)go(deck,pane+n);}
function tile(d,title,desc){return '<button class="tile" data-go="'+d+'">'+icon(d)+'<strong>'+title+'</strong><small>'+desc+'</small></button>';}
function modal(title,body,actions,after){
 restoreFocus=document.activeElement;
 $('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').replaceChildren();
 for(const a of actions){const b=document.createElement('button');b.textContent=a.label;if(a.primary)b.className='primary';b.onclick=()=>{closeModal();a.run?.();};$('modalActions').append(b);}
 dialog.oncancel=e=>{e.preventDefault();closeModal();after?.();};dialog.showModal();$('modalActions').querySelector('button')?.focus();
}
function closeModal(){if(dialog.open)dialog.close();restoreFocus?.focus?.();restoreFocus=null;}
function save(){try{if(loadError)throw Error('Preview storage error: '+loadError);const current=JSON.parse(localStorage.getItem(key)||'null');if(current&&current.revision!==library.revision)throw Error('Preview changed in another tab. Reload or export draft.');if(!library.profiles.every(StudioCodec.validProfile))throw Error('Invalid profile settings.');const next=copy(library);next.revision++;localStorage.setItem(key,JSON.stringify(next));library=next;baseline=JSON.stringify(next);render();}catch(e){modal('Save failed','<p class="error">'+esc(e.message)+'</p>',[{label:'Close'}]);}}
function exportProfile(){const p=profile(),blob=new Blob([JSON.stringify(StudioCodec.portable(p),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.name.replace(/[^a-zA-Z0-9_-]/g,'_')+'.ogx-profile.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function renderHome(){const saved=JSON.parse(baseline);return '<button class="hero" data-go="profiles"><small>'+(saved.active===library.active?'ACTIVE PROFILE':'PROPOSED ACTIVE · SAVE TO APPLY')+' · MEATVAULT™</small><strong>'+esc(library.profiles.find(p=>p.id===library.active).name)+'</strong><span class="muted">Browser-local preview · no dongle connected</span></button><div class="tiles">'+tile('controller','Controller','Visual remapping')+tile('tuning','Tuning','Precision response')+tile('profiles','Profiles','MeatVault™')+tile('about','About','Hambone Industries')+'</div>';}
const skinRow=()=>'<div class="row" aria-label="Controller skin">'+Object.entries(skins).map(([k,v])=>'<button data-skin="'+k+'" aria-pressed="'+(skin===k)+'">'+v.label+'</button>').join('')+'</div>';
const mapToggle=p=>'<button id="toggleMap" '+(!editable()?'disabled':'')+' aria-pressed="'+p.custom+'">Remapping: '+(p.custom?'ON':'STOCK')+'</button>';
function mapper(){
 const p=profile(),a=analyzeMap(p.map,p.igr);
 if(pane===0)return '<div class="heading"><h2>Controller</h2><small>ReFlex Mapping™</small></div><div class="canvas">'+controllerSvg(skin,p,null,operation)+'</div>'+skinRow()+'<div class="row">'+mapToggle(p)+'<button id="openMapper">Open remapper</button></div><div class="card muted">'+esc(p.name)+' · '+p.map.filter((v,i)=>v!==i+1).length+' changed · '+a.missing.length+' missing · '+a.duplicates.length+' shared</div>';
 if(pane===1)return skinRow()+'<div class="row">'+['remap','swap','disable'].map(op=>'<button data-op="'+op+'" aria-pressed="'+(op===operation)+'">'+op[0].toUpperCase()+op.slice(1)+'</button>').join('')+'</div><div class="canvas" id="canvas">'+controllerSvg(skin,p,source,operation)+'</div><div class="prompt" role="status">'+(!editable()?'Factory preset — duplicate to edit.':!p.custom?'Enable remapping to begin.':source===null?'Tap the physical source.':('<strong>'+esc(physicalName(skin,source))+'</strong> selected. '+(operation==='swap'?'Tap another physical button.':'Tap an Xbox output.')))+'</div><div class="row">'+mapToggle(p)+'<button id="other" '+(!p.custom||!editable()?'disabled':'')+'>'+(source===null?'Other inputs':'Other outputs')+'</button></div><div class="legend">* Missing · blue count: shared · × Disabled · R: IGR</div>';
 if(pane===2){let rows=p.map.map((t,i)=>t!==i+1?'<div class="item">'+esc(physicalName(skin,i+1))+' → Xbox '+esc(names[t])+'</div>':'').filter(Boolean);rows.push(...a.missing.map(i=>'<div class="item warning">Xbox '+esc(names[i])+' has no assigned input.</div>'),...a.duplicates.map(i=>'<div class="item info">Xbox '+esc(names[i])+' shared by '+a.owners[i].length+' inputs.</div>'));return '<h2>Assignment summary</h2><div class="row"><div class="card"><small>Changed</small><span class="metric">'+p.map.filter((t,i)=>t!==i+1).length+'</span></div><div class="card"><small>Missing</small><span class="metric warning">'+a.missing.length+'</span></div><div class="card"><small>Shared</small><span class="metric info">'+a.duplicates.length+'</span></div></div><div class="card"><small>'+(p.custom?'Custom mapping':'Stored map; bypassed')+'</small><div class="list">'+(rows.length?rows.slice(group*4,group*4+4).join(''):'No modified assignments.')+'</div><div class="row"><button id="groupPrev" '+(!group?'disabled':'')+'>‹</button><small>'+Math.min(group+1,Math.max(1,Math.ceil(rows.length/4)))+' / '+Math.max(1,Math.ceil(rows.length/4))+'</small><button id="groupNext" '+((group+1)*4>=rows.length?'disabled':'')+'>›</button></div><button id="resetMap" '+(!editable()?'disabled':'')+'>Restore stock map</button></div>';}
 if(pane===3){const ids=[[5,6,7,8],[1,2,3,4],[9,10,17,18],[11,12,13,14],[15,16]][group%5];return '<h2>Advanced mapping</h2><div class="row"><button id="groupPrev">‹</button><span class="muted">'+['Face','D-pad','Shoulders','System / sticks','Extras'][group%5]+'</span><button id="groupNext">›</button></div><div class="card">'+ids.map(i=>'<div class="maprow"><span>'+esc(physicalName(skin,i))+'</span><button data-advanced="'+i+'" '+(!editable()||!p.custom||isReserved(i,p.igr)?'disabled':'')+'>'+esc(names[p.map[i-1]])+'</button></div>').join('')+'</div>';}
 return '<h2>Portable profile</h2><div class="card"><h3>Export '+esc(p.name)+'</h3><p class="muted">Portable v2 JSON includes mapping and tuning layers. This preview exports the current draft.</p><button id="export">Export profile</button></div><div class="card"><h3>Import profile</h3><p class="muted">Select the layers to bring into a new profile.</p><button id="import">Choose file</button></div>';
}
function showTargetPicker(i){
 source=i;operation='remap';
 modal('Select Xbox output','<div class="list">'+names.map((n,id)=>'<button data-target="'+id+'">'+esc(n)+'</button>').join('')+'</div>',[{label:'Cancel',run:()=>{source=null;render();}}],()=>{source=null;render();});
 dialog.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{closeModal();proposal(+b.dataset.target);});
}
function proposal(target){
 const p=profile(),s=source,op=operation;
 if(s===null||!editable()||!p.custom||isReserved(s,p.igr)||op==='swap'&&(target===s||isReserved(target,p.igr)||!target))return;
 const next=editMap(p.map,s,target,op==='swap'?'swap':'remap',p.igr);
 const before=analyzeMap(p.map,p.igr),after=analyzeMap(next,p.igr);
 const warnings=after.missing.filter(i=>!before.missing.includes(i)).map(i=>'Xbox '+names[i]+' will have no assigned input.').concat(after.duplicates.filter(i=>!before.duplicates.includes(i)).map(i=>'Xbox '+names[i]+' will have shared inputs.'));
 const label=op==='swap'?'Confirm swap':target===0?'Disable input?':'Confirm remap';
 const summary=op==='swap'?physicalName(skin,s)+' ↔ '+physicalName(skin,target):physicalName(skin,s)+' → '+(target===0?'Disabled':'Xbox '+names[target]);
 const description=op==='swap'?physicalName(skin,s)+' will send '+names[next[s-1]]+'; '+physicalName(skin,target)+' will send '+names[next[target-1]]+'.':'Current output: '+names[p.map[s-1]]+'.';
 modal(label,'<div class="bigArrow">'+esc(summary)+'</div><p>'+esc(description)+'</p>'+warnings.map(w=>'<p class="warning">'+esc(w)+'</p>').join('')+'<small>Changes apply to this draft until saved.</small>',[{label:'Cancel',run:()=>{source=null;render();content.querySelector('[data-key="'+s+'"]')?.focus({preventScroll:true});}},{label:'Confirm',primary:true,run:()=>{p.map=next;source=null;render();content.querySelector('[data-key="'+s+'"]')?.focus({preventScroll:true});}}],()=>{source=null;render();content.querySelector('[data-key="'+s+'"]')?.focus({preventScroll:true});});
}
function tap(i){
 if(deck!=='controller'||pane!==1||dialog.open||!editable()||!profile().custom)return;
 if(source===null){if(isReserved(i,profile().igr))return;source=i;if(operation==='disable')proposal(0);else render();}
 else if(operation==='swap'&&i===source){source=null;render();}
 else proposal(i);
}
function renderProfiles(){
 const p=profile();
 if(pane===0)return '<h2>MeatVault™</h2><div class="hero"><small>'+ (JSON.parse(baseline).active===library.active?'ACTIVE PROFILE':'PROPOSED ACTIVE · SAVE TO APPLY')+'</small><strong>'+esc(library.profiles.find(p=>p.id===library.active).name)+'</strong><span>Editing '+esc(p.name)+'</span></div><div class="card"><h3>'+esc(p.name)+'</h3><small>'+(editable()?'Editable profile':'Protected preset')+'</small><button id="useProfile" '+(library.active===editing?'disabled':'')+'>Use selected profile on save</button><button id="duplicate">Duplicate profile</button></div><button id="library">Browse library</button>';
 if(pane===1){const list=library.profiles.slice(group*3,group*3+3);return '<h2>Profile library · '+library.profiles.length+'/12</h2><div class="list">'+list.map(x=>'<button data-profile="'+x.id+'"><strong>'+esc(x.name)+'</strong><br><small>'+(x.id===editing?'Editing · ':'')+(x.id===library.active?'Selected active · ':'')+(x.id<2?'Protected':'Custom')+'</small></button>').join('')+'</div><div class="row"><button id="groupPrev" '+(!group?'disabled':'')+'>‹</button><span>'+ (group+1) +'/'+Math.ceil(library.profiles.length/3)+'</span><button id="groupNext" '+((group+1)*3>=library.profiles.length?'disabled':'')+'>›</button></div><button id="duplicate">Duplicate selected</button>';}
 if(pane===2)return '<h2>QuadSlot™</h2><div class="slotgrid">'+[0,3,1,2].map(j=>'<button class="card slot slot'+j+'" data-slot="'+j+'"><small>'+['↑','→','↓','←'][j]+' Slot '+(j+1)+'</small><strong>'+esc(library.profiles.find(p=>p.id===library.slots[j])?.name||'Unassigned')+'</strong></button>').join('')+'<div class="slotCenter">✚</div></div><small>Local slot assignments only. Physical Start + Back shortcut is pending firmware integration.</small>';
 if(pane===3)return '<h2>Manage profiles</h2><div class="card"><strong>'+esc(p.name)+'</strong><small>'+(editable()?'Editable':'Protected preset')+'</small></div><div class="tiles"><button id="newProfile" class="tile"><strong>New profile</strong><small>Factory values</small></button><button id="duplicate" class="tile"><strong>Duplicate</strong><small>Copy selected</small></button><button id="rename" class="tile" '+(!editable()?'disabled':'')+'><strong>Rename</strong></button><button id="deleteProfile" class="tile" '+(!editable()?'disabled':'')+'><strong>Delete</strong></button></div><button id="import">Import profile</button>';
 if(pane===5)return importView();
 return layerDeck(p,true);
}
function updateSaveBar(){
 $('saveState').textContent=loadError?'Preview storage unavailable':dirty()?'Unsaved preview changes':'Preview profile saved locally';
 $('primary').textContent=dirty()?'Save changes':'Export profile';$('primary').onclick=()=>dirty()?save():exportProfile();
}

function render(){
 const focused=document.activeElement?.dataset?.key;
 const p=profile();
 content.innerHTML=deck==='home'?renderHome():deck==='controller'?mapper():deck==='profiles'?renderProfiles():deck==='tuning'?tuningEditor():'<div class="placeholder">'+icon('about')+'<h2>'+esc(panes[deck][pane])+'</h2><p>Hambone Industries<br><small>A Meat Inc. subsidiary</small></p><p class="muted">'+(pane===2?'S.H.R.E.K. — Synthetic Hierarchical Response Enablement Kernel. Controllers have layers.':pane===1?'Select Controller to try the three Hambone-style vector skins. Confirm changes in the popup, then save or export the draft.':'The competition is running stock firmware. Adorable.<br><small>The Hambone name and logo are trademarks of Hambone Industries, a subsidiary of Meat Inc. (fictional branding).</small>')+'</p><small>Local design preview · based on upstream OGX.</small></div>';
 content.scrollTop=0;
 $('pick').textContent=(deck==='home'?'Home':panes[deck][pane])+' · '+(pane+1)+' / '+panes[deck].length;$('prev').disabled=pane===0;$('next').disabled=pane===panes[deck].length-1;
 updateSaveBar();bindTuning();
 content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{group=0;go(b.dataset.go);});
 content.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{skin=b.dataset.skin;source=null;render();});
 content.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{operation=b.dataset.op;source=null;render();});
 content.querySelectorAll('[data-key]').forEach(b=>{b.onclick=()=>tap(+b.dataset.key);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(+b.dataset.key);}};});
 content.querySelectorAll('[data-advanced]').forEach(b=>b.onclick=()=>showTargetPicker(+b.dataset.advanced));
 content.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{editing=+b.dataset.profile;go('profiles',0);});
 const bind=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};
 bind('toggleMap',()=>{if(editable()){p.custom=!p.custom;source=null;render();}});
 bind('openMapper',()=>go('controller',1));bind('library',()=>{group=0;go('profiles',1);});
 bind('useProfile',()=>{library.active=editing;render();});bind('export',exportProfile);
 bind('groupPrev',()=>{group=pane===3&&deck==='controller'?(group+4)%5:Math.max(0,group-1);render();});bind('groupNext',()=>{group=pane===3&&deck==='controller'?(group+1)%5:group+1;render();});
 bindProfiles();
 if(focused)content.querySelector('[data-key="'+focused+'"]')?.focus({preventScroll:true});
 bind('other',()=>{if(source!==null){if(operation==='swap'){modal('Select physical input','<div class="list">'+identityMap().filter(i=>i!==source&&!isReserved(i,p.igr)).map(i=>'<button data-extra="'+i+'">'+esc(physicalName(skin,i))+'</button>').join('')+'</div>',[{label:'Cancel',run:()=>{source=null;render();}}],()=>{source=null;render();});dialog.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{closeModal();proposal(+b.dataset.extra);});}else showTargetPicker(source);}else{modal('Select physical input','<div class="list">'+identityMap().filter(i=>!isReserved(i,p.igr)).map(i=>'<button data-extra="'+i+'">'+esc(physicalName(skin,i))+'</button>').join('')+'</div>',[{label:'Cancel'}]);dialog.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{closeModal();tap(+b.dataset.extra);});}});
}
$('home').onclick=()=>{group=0;go('home',0);};$('prev').onclick=()=>{group=0;step(-1);};$('next').onclick=()=>{group=0;step(1);};
function picker(workspaces){const values=workspaces?Object.keys(panes):panes[deck];modal(workspaces?'Workspaces':'Select pane','<div class="list">'+values.map((v,i)=>'<button data-pick="'+i+'">'+esc(v[0].toUpperCase()+v.slice(1))+'</button>').join('')+'</div>',[{label:'Cancel'}]);dialog.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{closeModal();group=0;if(workspaces)go(values[+b.dataset.pick]);else go(deck,+b.dataset.pick);});}
$('menu').onclick=()=>picker(true);$('pick').onclick=()=>picker(false);
let gesture=null;
content.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.target.closest('button,input,select,textarea,svg,[data-key]')||dialog.open)return;gesture={x:e.clientX,y:e.clientY,id:e.pointerId};});
content.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){group=0;step(dx<0?1:-1);}});
content.addEventListener('pointercancel',()=>gesture=null);
let touchOrigin=null;
content.addEventListener('touchstart',e=>{touchOrigin=null;if(e.touches.length!==1||e.target.closest('button,input,select,textarea,svg,[data-key]')||dialog.open)return;const t=e.touches[0];touchOrigin={x:t.clientX,y:t.clientY,id:t.identifier};},{passive:true});
content.addEventListener('touchend',e=>{const start=touchOrigin;touchOrigin=null;if(!start||dialog.open)return;const t=Array.from(e.changedTouches).find(t=>t.identifier===start.id);if(!t)return;const dx=t.clientX-start.x,dy=t.clientY-start.y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){group=0;step(dx<0?1:-1);}},{passive:true});
content.addEventListener('touchcancel',()=>touchOrigin=null,{passive:true});
setupImport();
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
render();
</script></body></html>
